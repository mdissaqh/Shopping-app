
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ShopNow{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'shop/styles.css' %}">
</head>

<body>

    <header class="navbar">
        <a href="{% url 'shop:product_list' %}" class="logo">
            ShopNow
        </a>

        <nav>
            <a href="{% url 'shop:product_list' %}">Home</a>

            <a href="{% url 'shop:cart_detail' %}" class="cart-link">
                Cart <span class="cart-badge">{{ cart_count }}</span>
            </a>
        </nav>
    </header>

    <main class="container">

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}

    </main>

    <footer>
        <p>© 2026 ShopNow. All rights reserved.</p>
    </footer>

</body>
</html>
